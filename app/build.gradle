plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tvlauncher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // A fixed signing key, so every new build can be installed over the old one
    // without wiping your chosen apps.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No extra libraries are used on purpose: fewer things that can break the build.
